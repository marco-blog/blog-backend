# 테스트 프로필(surefire가 모든 테스트에 켠다). 개발 DB(cf_u2_d2)는 절대 쓰지 않는다.
# - Repository 테스트(@JpaRepositoryTest): H2 메모리 DB(MySQL 모드). 접속 정보는 애너테이션의 @TestPropertySource가 정하고
#   아래 datasource 값과 환경 변수는 쓰지 않는다.
# - MySQL 전용 쿼리 테스트(@MySqlRepositoryTest): 전용 테스트 MySQL 스키마(Crowfoot cf_u2_d3, CI는 mysql:8.4 컨테이너의 blog_test).
#   BLOG_TEST_DATASOURCE_URL       예) jdbc:mysql://s4.java21.net:13306/cf_u2_d3?connectionTimeZone=UTC&characterEncoding=UTF-8
#   BLOG_TEST_DATASOURCE_USERNAME
#   BLOG_TEST_DATASOURCE_PASSWORD
#   BLOG_TEST_ALLOW_CLEAN=true     테스트 시작 때 스키마를 다시 만드는 것을 허용
# 위 변수가 없으면 DB 테스트는 건너뛴다(@MySqlRepositoryTest).
# 스키마는 TestSchemaInitializer가 db/schema-mysql.sql 스냅숏으로 JVM당 한 번 다시 만든다.
spring:
  datasource:
    url: ${BLOG_TEST_DATASOURCE_URL:}
    username: ${BLOG_TEST_DATASOURCE_USERNAME:}
    password: ${BLOG_TEST_DATASOURCE_PASSWORD:}

blog:
  crypto:
    # 테스트 전용 고정 키(비밀 아님). 운영·개발 키로 쓰지 않는다.
    active-key-version: 1
    keys:
      "[1]": dGVzdC1vbmx5LWtleS12MS0wMDAwMDAwMDAwMDAwMDA=
    hash-key: dGVzdC1vbmx5LWhhc2gta2V5LTAwMDAwMDAwMDAwMDA=
  auth:
    # 테스트 전용 고정 JWT 서명 키(비밀 아님, 32바이트 이상). 운영·개발 키로 쓰지 않는다.
    jwt-secret: test-only-jwt-secret-not-for-production-0000
  security:
    allowed-origins: http://localhost:5173
