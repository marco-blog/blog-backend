# 공통 설정. 환경별 값은 프로필 파일에 둔다.
#   local: application-local.yml (커밋하지 않음, 예시는 application-local.yml.example)
#   prod : application-prod.yml  (접속 정보는 환경 변수로만)
#   test : src/test/resources/application-test.yml
#          Repository 테스트(@JpaRepositoryTest)는 H2(MySQL 모드), MySQL 전용 쿼리(@MySqlRepositoryTest)만 테스트 DB cf_u2_d3
# 프로필을 지정하지 않으면 local로 실행한다. 운영은 SPRING_PROFILES_ACTIVE=prod.
spring:
  application:
    name: blog-backend
  profiles:
    default: local
  task:
    scheduling:
      # 정기 작업끼리 서로 기다리지 않게 스케줄러 스레드를 3개로 둔다(007 research E1).
      pool:
        size: 3
    execution:
      # feedFetchExecutor 빈이 있어도 기본 applicationTaskExecutor를 만든다(풀을 공유하지 않음).
      mode: force
  # 이미지 업로드(US4): 파일당 한도는 blog.media.max-size(10MB)와 같게, 요청 전체는 폼 필드 여유를 더한다.
  # 넘으면 MaxUploadSizeExceededException → 413 MEDIA_TOO_LARGE.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Crowfoot ERD 문서가 관리한다(blog-docs/db/README.md).
      # Hibernate는 엔티티와 스키마가 맞는지 확인만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # N+1 완화: LAZY 연관을 IN 절로 100개씩 묶어 읽는다(원칙 v2.5.0). 목록은 fetch join 또는 DTO projection이 우선.
        default_batch_fetch_size: 100

server:
  tomcat:
    # 한도를 넘은 업로드에도 연결을 끊지 않고 413 응답을 돌려줄 수 있게 남은 본문을 읽어 버린다(기본 2MB).
    max-swallow-size: 20MB
  # 방문자 주소는 ClientAddressFilter가 blog.security.trusted-proxies(front 서버)가 보낸 X-Forwarded-For에서만 꺼낸다.
  # framework(ForwardedHeaderFilter)·native는 쓰지 않는다(framework는 아무 접속자의 헤더나 믿는다).
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # 메일 발송기(MailConfig)가 있어도 SMTP 접속을 health에 넣지 않는다(메일 서버 장애로 서비스가 DOWN이 되지 않게).
    mail:
      enabled: false

blog:
  # 서비스 주소(허용 Origin과 별개로 메일 링크 같은 절대 URL에 쓴다). 운영 기본값, 개발은 프로필 파일에서 덮어쓴다.
  base-url: https://blog.java21.net
  crypto:
    # 개인정보 암호화(FR-134~136). 키 값은 프로필 파일이 .env 또는 환경 변수에서 읽는다.
    active-key-version: ${BLOG_CRYPTO_ACTIVE_KEY_VERSION:1}
  # 인증(001 contracts/api.md "프로퍼티"). 아래 값이 기본값이며 AuthProperties에도 같은 기본값이 있다.
  # jwt-secret(HS256, UTF-8 32바이트 이상)은 필수이고 프로필 파일이 .env 또는 환경 변수 BLOG_AUTH_JWT_SECRET에서 읽는다.
  auth:
    access-ttl: 30m
    refresh-idle-ttl: 4h
    refresh-absolute-ttl: 7d
    refresh-reuse-grace: 10s
    login-max-failures: 5
    login-lock-duration: 10m
  # 블로그(FR-158): 회원별 한도(users.max_blogs)가 없을 때 회원 1명이 가질 수 있는 블로그 수. 1.0에서는 관리 화면에서 바꾸지 않는다.
  blogs:
    default-max-per-member: 3
  # 약관·개인정보처리방침 버전(4개 언어 공통, FR-081·155). 가입 요청의 termsVersion과 같아야 한다.
  # 문안을 바꾸면 이 값을 올린다(환경 변수 BLOG_LEGAL_TERMS_VERSION으로 덮어쓸 수 있다).
  legal:
    terms-version: ${BLOG_LEGAL_TERMS_VERSION:2026-10-06}
  # 글(FR-020): 같은 사람(회원 ID 또는 방문자 쿠키)의 재조회를 세지 않는 기간과 캐시 크기, 익명 방문자 쿠키(없으면 조회수 API가 발급, 1년).
  posts:
    view-dedup-ttl: 30m
    view-dedup-max-size: 100000
    visitor-cookie: visitor_id
    visitor-cookie-max-age: 365d
    # 글 일별 통계(post_daily_stats, 003 FR-086) 보관 기간. 인기 점수는 최근 7일만 쓴다.
    stats-retention: 90d
    # 004 보호 글(FR-062·063): 열람 쿠키 수명, 비밀번호 연속 실패 허용 수와 막는 시간(비회원 글 비밀번호도 같음), 예약 발행 최대 앞날(FR-064).
    unlock-ttl: 30m
    password-max-failures: 5
    password-lock-duration: 10m
    schedule-max-ahead: 365d
  # 004 방문자 수·월별 보관함(FR-061·067): 날짜 기준 시간대, 방문 중복 제거 캐시 크기, 세지 않는 User-Agent(빈 값도 세지 않음).
  stats:
    time-zone: Asia/Seoul
    visit-dedup-max-size: 200000
    bot-user-agent-pattern: "(?i)(bot|crawler|spider|slurp|facebookexternalhit|preview)"
  # 004 비회원 댓글·방명록(FR-066): 작성 IP 보관 기간. 작성 한도는 005 blog.ratelimit.*(E2E는 BLOG_RATELIMIT_*로 넉넉하게 띄운다).
  guest:
    ip-retention: 90d
  # 005 작성 속도 한도 기본값(운영 설정 ratelimit.*가 없을 때). 004 blog.guest.*-per-minute를 대체한다.
  ratelimit:
    post-publish-per-hour: 10
    comment-per-minute: 5
    guestbook-per-minute: 3
    media-upload-per-minute: 30
    signup-per-ip-per-hour: 5
  # 005 반복 스팸 기준 기본값(운영 설정 spam.duplicate-comment가 없을 때)
  spam:
    duplicate-comment:
      window-minutes: 10
      max-count: 3
      min-length: 10
  # 005 CAPTCHA(FR-141): provider는 프로필 파일이 정한다(local none, prod turnstile). secret은 커밋하지 않는다.
  captcha:
    test-token: e2e-pass
    verify-timeout: 3s
    login-failures-before-captcha: 3
  # 005 신고(FR-040·041)
  reports:
    member-per-hour: 30
    rights-request-per-ip-per-hour: 5
    penalty-window: 90d
  # 005 트랙백(FR-049~055)
  trackback:
    receive-limit: 10
    receive-window: 10m
    connect-timeout: 5s
    read-timeout: 5s
    max-targets: 10
    executor-threads: 2
    executor-queue: 100
    recover-pending-after: 5m
  # 005 나가는 요청(SSRF 방어, research M16). allow-private는 시험용(prod에서 true면 기동 실패).
  outbound:
    allowed-ports: 80,443,8080,8443
    allow-private: false
  # 004 블로그 백업(FR-145): 디렉터리(dir)는 프로필 파일이 정한다(local ./data/exports, prod 환경 변수 BLOG_EXPORT_DIR 필수).
  export:
    retention: 7d
    min-interval: 24h
    stale-running: 1h
  # 정기 작업(research R26). 휴지통 비우기(FR-084, FR-159): 보관 기간이 지난 휴지통 글과 삭제된 블로그를 건수 단위로 정리한다.
  # 메일(FR-133, research R23). host·port·from은 프로필 파일이, username·password는 환경 변수가 준다.
  mail:
    starttls: true
  # 개인정보 보관 기간(FR-138·139). 파기 작업은 blog.jobs.privacy-purge-cron.
  privacy:
    withdrawn-retention: 30d
    login-history-retention: 90d
    # 005: 처리 후 권리 침해 신고 연락 이메일, 트랙백 송신 IP 보관 기간
    rights-request-retention: 365d
    trackback-ip-retention: 90d
  jobs:
    # 개인정보 파기(FR-138·139): 탈퇴 30일 경과 회원의 개인정보, 90일 지난 로그인 기록, 만료된 재설정·리프레시 토큰.
    privacy-purge-cron: "0 0 4 * * *"
    trash-purge-cron: "0 30 3 * * *"
    trash-retention: 30d
    purge-batch-size: 500
    # 오래된 알림 정리(002 research D3): blog.notifications.retention이 지난 알림을 지운다.
    notification-purge-cron: "0 15 4 * * *"
    # 글 일별 통계 정리(003 research P4): blog.posts.stats-retention이 지난 post_daily_stats 행을 지운다.
    post-stats-purge-cron: "0 45 4 * * *"
    # 004 예약 발행(SC-010)·백업 생성 주기와 만료 백업 정리(매시 10분). 주기 두 값은 @Scheduled 자리표시자 기본값도 같다.
    scheduled-publish-delay: 30s
    export-poll-delay: 30s
    export-cleanup-cron: "0 10 * * * *"
  # 알림(002 FR-033, contracts/api.md "프로퍼티").
  notifications:
    retention: 90d
    # 같은 구독자·블로그의 NEW_SUBSCRIBER 알림을 다시 만들지 않는 기간(구독·취소 반복 방지).
    subscriber-dedup-window: 24h
  # 검색(002 FR-035, research D4): 검색어에서 쓰는 낱말 수와 최소 길이(MySQL ngram_token_size와 같게).
  search:
    max-terms: 5
    min-term-length: 2
  # 사이트맵(002 FR-037, research D5): /sitemap/posts-{n}.xml 파일 하나의 주소 수(표준 상한 50,000).
  sitemap:
    urls-per-file: 50000
  # 이미지(US4, research R11). upload-dir·temp-dir·thumbnail-dir는 필수이며 프로필 파일이 정한다(local은 임시 디렉터리 기본값,
  # prod는 환경 변수). 기동 때 세 디렉터리를 만들고 쓸 수 없으면 기동을 멈춘다. 아래는 기본값(MediaProperties와 같다).
  media:
    temp-ttl: 24h
    temp-quota: 200MB
    max-size: 10MB
    # 원본 가로×세로 상한(압축 폭탄 방지). 넘으면 413 MEDIA_TOO_LARGE
    max-pixels: 40000000
    cleanup-cron: "0 0 * * * *"
    allowed-types: [image/jpeg, image/png, image/gif, image/webp]
    thumbnail:
      # FR-131 기본 크기(50x50, 100x100, 160x160, 300x200, 600x400, 1200x630)와 각 2배를 중복 없이
      sizes: [50x50, 100x100, 160x160, 200x200, 300x200, 320x320, 600x400, 1200x630, 1200x800, 2400x1260]
  # 포털(003 contracts/api.md "프로퍼티"). score-weights·new-member-delay·min-content-length·topic-auto-hide-threshold는
  # 운영 설정(system_settings, 관리자 콘솔 "포털 설정")에 값이 없을 때의 기본값이다.
  # 로컬 수동 검증·E2E는 BLOG_PORTAL_CACHE_TTL=0s, BLOG_PORTAL_NEW_MEMBER_DELAY=PT0S, BLOG_PORTAL_TOPIC_AUTO_HIDE_THRESHOLD=1로 띄운다.
  portal:
    # 포털 목록·인기 점수·주제별 글 수 캐시 수명(FR-090: 글 상태 변화는 이 시간 안에 반영). 0s면 캐시하지 않는다.
    cache-ttl: 5m
    cache-max-size: 2000
    score-weights:
      view: 1
      read-complete: 5
      like: 10
      comment: 8
      half-life-hours: 48
      report-penalty: 0.5
    new-member-delay: 24h
    min-content-length: 200
    topic-auto-hide-threshold: 20
    popular-window: 7d
    topic-count-window: 30d
  release-notes:
    # 최신 릴리스 노트를 포털 메인 카드로 보여주는 기간(처음 게시 시각부터, 003 FR-162)
    portal-card-days: 14d
  # 관리자(006 FR-105): 기동 시 SUPER_ADMIN이 한 명도 없으면 이 이메일의 회원을 SUPER_ADMIN으로 지정한다(첫 최고 관리자 지정의 유일한 경로).
  # 값은 환경 변수(또는 .env)로만 주고 저장소에 커밋하지 않는다. 비우면 아무것도 하지 않는다.
  admin:
    bootstrap-super-admin-email: ${BLOG_ADMIN_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
