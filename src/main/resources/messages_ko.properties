# 메일 문구(기준 언어). 키를 더하면 4개 언어 파일에 함께 넣는다(MessageKeysConsistencyTest).
mail.site-name=블로그
# 비밀번호 재설정 메일(FR-133). {0}=서비스 이름, {1}=재설정 링크, {2}=링크 유효 시간(분). 작은따옴표는 두 번('') 쓴다.
mail.passwordReset.subject=비밀번호 재설정 안내
mail.passwordReset.body=안녕하세요, {0}입니다.\n\n아래 링크에서 새 비밀번호를 정해 주세요. 링크는 {2}분 동안 한 번만 쓸 수 있습니다.\n\n{1}\n\n비밀번호 재설정을 요청하지 않았다면 이 메일을 무시해도 됩니다. 비밀번호는 바뀌지 않습니다.

# 005 권리 침해 신고 결과 메일(research M10). {0} 사이트 이름, {1} 신고한 주소
mail.rightsRequest.subject=[{0}] 권리 침해 신고 처리 결과
mail.rightsRequest.body.actioned=안녕하세요, {0}입니다.\n\n보내 주신 권리 침해 신고를 검토해 해당 콘텐츠에 조치했습니다.\n\n신고한 주소: {1}\n\n이 메일은 회신을 받지 않습니다.
mail.rightsRequest.body.dismissed=안녕하세요, {0}입니다.\n\n보내 주신 권리 침해 신고를 검토했으나 조치하지 않기로 했습니다.\n\n신고한 주소: {1}\n\n이 메일은 회신을 받지 않습니다.
