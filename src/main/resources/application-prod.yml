# 운영 프로필. 접속 정보는 환경 변수로만 받는다. 기본값이 없어서 빠지면 기동에 실패한다.
#   SPRING_DATASOURCE_URL       예) jdbc:mysql://<host>:<port>/<schema>?connectionTimeZone=UTC&characterEncoding=UTF-8
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   BLOG_CRYPTO_KEY_V1              개인정보 암호화 키(Base64 32바이트, openssl rand -base64 32)
#   BLOG_CRYPTO_HASH_KEY            검색용 HMAC 키(Base64 32바이트). 한번 정하면 바꾸지 않는다.
#   BLOG_CRYPTO_ACTIVE_KEY_VERSION  현재 암호화 키 버전(기본 1)
#   BLOG_SECURITY_TRUSTED_PROXIES   X-Forwarded-For를 믿는 front 서버 주소(IP·CIDR, 쉼표로 구분). 기본 127.0.0.1,::1(같은 호스트).
#                                   front가 다른 호스트·컨테이너면 그 주소로 바꾼다. 틀리면 방문자 IP 대신 front 주소가 기록된다.
#   BLOG_AUTH_JWT_SECRET            접근 토큰(JWT HS256) 서명 키(UTF-8 32바이트 이상, openssl rand -base64 48).
#                                   바꾸면 발급된 접근 토큰이 모두 무효가 된다(리프레시로 다시 받는다).
#   BLOG_MAIL_HOST / BLOG_MAIL_PORT  SMTP 서버(비밀번호 재설정 메일, FR-133)
#   BLOG_MAIL_USERNAME / BLOG_MAIL_PASSWORD  SMTP 인증(비밀 값)
#   BLOG_MAIL_FROM                  보내는 사람 주소
#   BLOG_MAIL_STARTTLS              STARTTLS 사용(기본 true)
#   BLOG_MEDIA_UPLOAD_DIR / BLOG_MEDIA_TEMP_DIR / BLOG_MEDIA_THUMBNAIL_DIR  이미지 정식·임시·썸네일 디렉터리(US4).
#                                   쓰기 가능해야 하며(없으면 만든다) 정식 디렉터리는 백업 대상, 썸네일은 다시 만들 수 있어 제외.
#   BLOG_EXPORT_DIR                 블로그 백업 zip 디렉터리(004 FR-145, 필수). 7일 뒤 지워지는 임시 파일이라 서버 일일 백업에서 빼도 된다.
#   BLOG_ADMIN_BOOTSTRAP_SUPER_ADMIN_EMAIL  (선택) SUPER_ADMIN이 없을 때 기동 시 최고 관리자로 지정할 회원 이메일(006 FR-105).
# 키 교체: 새 버전 키를 BLOG_CRYPTO_KEYS_2 처럼 추가 → BLOG_CRYPTO_ACTIVE_KEY_VERSION=2 → 재암호화 후 이전 키 제거.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false

# OpenAPI 문서(/v3/api-docs, Swagger UI)는 운영에서 끈다. front 타입 생성(gen:api)은 로컬 backend에서 한다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  level:
    root: INFO

blog:
  mail:
    host: ${BLOG_MAIL_HOST}
    port: ${BLOG_MAIL_PORT}
    username: ${BLOG_MAIL_USERNAME:}
    password: ${BLOG_MAIL_PASSWORD:}
    from: ${BLOG_MAIL_FROM}
    starttls: ${BLOG_MAIL_STARTTLS:true}
  crypto:
    keys:
      "[1]": ${BLOG_CRYPTO_KEY_V1}
    hash-key: ${BLOG_CRYPTO_HASH_KEY}
  auth:
    jwt-secret: ${BLOG_AUTH_JWT_SECRET}
  media:
    upload-dir: ${BLOG_MEDIA_UPLOAD_DIR}
    temp-dir: ${BLOG_MEDIA_TEMP_DIR}
    thumbnail-dir: ${BLOG_MEDIA_THUMBNAIL_DIR}
  export:
    dir: ${BLOG_EXPORT_DIR}
  # 005 CAPTCHA(FR-141): 1.0에서는 끈다(marco 2026-10-07). 켤 때는 provider를 turnstile로 바꾸고
  # site-key: ${BLOG_CAPTCHA_SITE_KEY}, secret-key: ${BLOG_CAPTCHA_SECRET_KEY}를 더한다. test는 운영에서 기동 실패.
  captcha:
    provider: none
  security:
    allowed-origins: https://blog.java21.net
    trusted-proxies: "${BLOG_SECURITY_TRUSTED_PROXIES:127.0.0.1,::1}"
