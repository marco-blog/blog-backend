# 로컬 개발 프로필(개발 DB cf_u2_d2). 프로필을 지정하지 않으면 local로 실행한다.
# 실행: ./mvnw spring-boot:run
# 비밀 값(DB 비밀번호 등)은 이 파일에 쓰지 않고 저장소 루트의 .env 에서 읽는다(커밋 금지, 예시는 .env.example).
# 환경 변수로 같은 이름(DB_PASSWORD)을 주면 .env 보다 우선한다.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://s4.java21.net:13306/cf_u2_d2?connectionTimeZone=UTC&characterEncoding=UTF-8
    username: cf_u2_d2
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true

logging:
  level:
    net.java21.blog: DEBUG

blog:
  # 메일 링크가 front 개발 서버로 가게 한다.
  base-url: ${BLOG_BASE_URL:http://localhost:5173}
  # 개발 메일은 Mailpit(docker run -p 1025:1025 -p 8025:8025 axllent/mailpit, 화면 http://localhost:8025)으로 보낸다.
  mail:
    host: ${BLOG_MAIL_HOST:localhost}
    port: ${BLOG_MAIL_PORT:1025}
    username: ${BLOG_MAIL_USERNAME:}
    password: ${BLOG_MAIL_PASSWORD:}
    from: ${BLOG_MAIL_FROM:no-reply@localhost}
    starttls: ${BLOG_MAIL_STARTTLS:false}
  crypto:
    # 개인정보 암호화 키(Base64 32바이트). .env 의 값을 쓴다. 생성: openssl rand -base64 32
    keys:
      "[1]": ${BLOG_CRYPTO_KEY_V1}
    hash-key: ${BLOG_CRYPTO_HASH_KEY}
  auth:
    # 접근 토큰 서명 키(UTF-8 32바이트 이상). .env 의 값을 쓴다. 생성: openssl rand -base64 48
    jwt-secret: ${BLOG_AUTH_JWT_SECRET}
  security:
    # 상태 변경 요청의 Origin 허용 목록(R3): front 개발 서버
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    # X-Forwarded-For를 믿는 접속 주소: 같은 컴퓨터의 front 개발 서버
    trusted-proxies:
      - 127.0.0.1
      - "::1"
