# 외부 글 자동 분류 키워드 사전(007 research E9, KeywordTopicClassifier).
# version: keyword-v1
# - 키는 003 TopicSeeder(portal/topics-seed.json)의 소분류 slug, 값은 그 주제를 가리키는 낱말 목록이다.
#   대분류(life·travel-food·culture·sports·knowledge)의 공통어는 넣지 않는다.
# - 정규화 규칙: NFKC → 앞뒤 공백 제거 → 소문자(Locale.ROOT). 매핑 규칙(topic_mapping_rules.keyword)·피드 태그와 같다.
# - 영어·숫자만으로 된 낱말은 토큰 완전 일치, 한글·가나·한자나 공백이 섞인 낱말은 부분 문자열로 찾는다.
#   그래서 한국어·일본어·중국어 낱말은 두 글자 이상으로 쓰고, 다른 낱말 안에 흔히 들어가는 짧은 말은 피한다.
# - 한 낱말은 한 주제에만 둔다(KeywordDictionaryTest가 중복을 막는다). 소분류마다 10개 이상.
# - 고치면 버전(KeywordTopicClassifier.VERSION)을 올리고 PR로 낸다(blog-backend/docs/operations.md).
